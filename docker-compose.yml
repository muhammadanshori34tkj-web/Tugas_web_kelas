services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword_ganti_ini
      MARIADB_DATABASE: tkj3_profile
      MARIADB_USER: tkj_app
      MARIADB_PASSWORD: tkj_app_password_ganti_ini
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: tkj_app
      DB_PASSWORD: tkj_app_password_ganti_ini
      DB_NAME: tkj3_profile
      DATA_SOURCE: mariadb
      NEXT_PUBLIC_SCHOOL_NAME: SMK Telkom Malang
    ports:
      - "3000:3000"

volumes:
  db_data: